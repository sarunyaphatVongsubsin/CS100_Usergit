<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>User List</title>
</head>
<body>
    <header class="mb-5">
        <div class="container mt-5">
            <div class="d-flex justify-content-end">
                <div class="btn-group" role="group" aria-label="Theme toggle">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-theme-value="dark">Dark</button>
                    <button type="button" class="btn btn-light btn-sm" data-bs-theme-value="light">Light</button>
                </div>
            </div>

            <h1 class="mb-4">Users</h1>
            <div class="row">
                <div class="col-md-4">
                    <input type="search" class="form-control form-control-lg" placeholder="Search Users" aria-label="Search Users">
                </div>
                <div class="col-md-8">
                    <nav class="nav d-flex justify-content-end align-items-center h-100 user-menu">
                        <a class="nav-link" href="#">Reputation</a>
                        <a class="nav-link text-bg-primary rounded-3" href="#">New Users</a>
                        <a class="nav-link" href="#">Editors</a>
                        <a class="nav-link" href="#">Moderators</a>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="row">
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-body d-flex gap-3">
                        <img src="https://randomuser.me/api/portraits/men/75.jpg" class="img-fluid rounded-circle flex-shrink-0 object-fit-cover" alt="John Doe" width="80" height="80"
                             data-bs-toggle="popover" data-bs-trigger="hover focus" tabindex="0" data-bs-content="john@gmail.com">
                        <div>
                            <h5 class="card-title mb-1">John Doe</h5>
                            <p class="text-body-secondary mb-2">Troy, MI</p>
                            <div class="d-flex flex-wrap gap-1">
                            <span class="badge text-bg-secondary">Nature</span>
                            <span class="badge text-bg-secondary">Travel</span>
                            <span class="badge text-bg-secondary">Sport</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-body d-flex gap-3">
                        <img src="https://randomuser.me/api/portraits/women/75.jpg" class="img-fluid rounded-circle flex-shrink-0 object-fit-cover" alt="Lehla Nichols" width="80" height="80"
                             data-bs-toggle="popover" data-bs-trigger="hover focus" tabindex="0" data-bs-content="lehla@gmail.com">
                        <div>
                            <h5 class="card-title mb-1">Lehla Nichols</h5>
                            <p class="text-body-secondary mb-2">Fort Worth, TX</p>
                            <div class="d-flex flex-wrap gap-1">
                            <span class="badge text-bg-secondary">Fashion</span>
                            <span class="badge text-bg-secondary">STEM</span>
                            <span class="badge text-bg-secondary">Architecture</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-body d-flex gap-3">
                        <img src="https://randomuser.me/api/portraits/women/44.jpg" class="img-fluid rounded-circle flex-shrink-0 object-fit-cover" alt="Annie Rice" width="80" height="80"
                             data-bs-toggle="popover" data-bs-trigger="hover focus" tabindex="0" data-bs-content="annie@gmail.com">
                        <div>
                            <h5 class="card-title mb-1">Annie Rice</h5>
                            <p class="text-body-secondary mb-2">Troy, MI</p>
                            <div class="d-flex flex-wrap gap-1">
                            <span class="badge text-bg-secondary">Electronics</span>
                            <span class="badge text-bg-secondary">Tech</span>
                            <span class="badge text-bg-secondary">Music</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-body d-flex gap-3">
                        <img src="https://randomuser.me/api/portraits/men/32.jpg" class="img-fluid rounded-circle flex-shrink-0 object-fit-cover" alt="Mark Wilson" width="80" height="80"
                             data-bs-toggle="popover" data-bs-trigger="hover focus" tabindex="0" data-bs-content="mark@gmail.com">
                        <div>
                            <h5 class="card-title mb-1">Mark Wilson</h5>
                            <p class="text-body-secondary mb-2">Austin, TX</p>
                            <div class="d-flex flex-wrap gap-1">
                            <span class="badge text-bg-secondary">Cooking</span>
                            <span class="badge text-bg-secondary">Gaming</span>
                            <span class="badge text-bg-secondary">Photography</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </main>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/darkmodetoggle.js"></script>
    <script>
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
        [...popoverTriggerList].map(el => new bootstrap.Popover(el));
    </script>
</body>
</html>
