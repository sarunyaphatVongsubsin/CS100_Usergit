<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>User List</title>
</head>
<body>
    <header class="mb-5">
        <div class="container mt-5">
            <div class="d-flex justify-content-end">
                <div class="btn-group" role="group" aria-label="Theme toggle">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-theme-value="dark">Dark</button>
                    <button type="button" class="btn btn-light btn-sm" data-bs-theme-value="light">Light</button>
                </div>
            </div>

            <h1 class="mb-4">Users</h1>
            <div class="row">
                <div class="col-md-4">
                    <input type="search" class="form-control form-control-lg" placeholder="Search Users" aria-label="Search Users">
                </div>
                <div class="col-md-8">
                    <nav class="nav d-flex justify-content-end align-items-center h-100 user-menu">
                        <a class="nav-link" href="#">Reputation</a>
                        <a class="nav-link text-bg-primary rounded-3" href="#">New Users</a>
                        <a class="nav-link" href="#">Editors</a>
                        <a class="nav-link" href="#">Moderators</a>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/darkmodetoggle.js"></script>
</body>
</html>
